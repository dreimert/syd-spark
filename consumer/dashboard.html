<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supervision réseau — Métropole de Lyon</title>
<style>
  :root { color-scheme: light dark; --bg:#0f1115; --fg:#e6e8eb; --dim:#8b93a1;
          --card:#171a21; --line:#262b35; --alerte:#ff6b5e; --warn:#ffb454; --ok:#4ec9a0; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 ui-sans-serif,system-ui,sans-serif; padding:28px; }
  h1 { font-size:19px; margin:0 0 4px; font-weight:600; }
  .sous { color:var(--dim); margin-bottom:22px; font-size:13px; }
  .grille { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-bottom:22px; }
  .carte { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .carte .n { font-size:26px; font-weight:600; font-variant-numeric:tabular-nums; }
  .carte .l { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  table { width:100%; border-collapse:collapse; background:var(--card);
          border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  th,td { padding:8px 12px; text-align:left; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; }
  th { color:var(--dim); font-weight:500; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  tr:last-child td { border-bottom:none; }
  .barre { height:6px; border-radius:3px; background:var(--line); position:relative; min-width:80px; }
  .barre i { position:absolute; inset:0 auto 0 0; border-radius:3px; }
  .tag { font-size:11px; padding:1px 6px; border-radius:4px; border:1px solid var(--line); color:var(--dim); }
  .err { color:var(--alerte); }
  section { margin-bottom:26px; }
  h2 { font-size:13px; color:var(--dim); text-transform:uppercase; letter-spacing:.05em; margin:0 0 10px; }
</style>
</head>
<body>
<h1>Supervision réseau — Métropole de Lyon</h1>
<div class="sous">Cellules en saturation (&gt; 70 % de la capacité nominale) — calcul Apache Spark, service Node.js</div>
<div id="app">Chargement…</div>

<script>
const couleur = t => t >= 100 ? 'var(--alerte)' : t >= 85 ? 'var(--warn)' : 'var(--ok)';
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

async function charger() {
  const app = document.getElementById('app');
  const r = await fetch('/api/saturation');
  if (!r.ok) {
    const e = await r.json();
    app.innerHTML = `<div class="carte err">${esc(e.erreur)}<br><span class="sous">${esc(e.indice || '')}</span></div>`;
    return;
  }
  const { total, resultats } = await r.json();
  const { secteurs } = await (await fetch('/api/secteurs')).json();
  const pire = resultats[0] || {};

  app.innerHTML = `
    <div class="grille">
      <div class="carte"><div class="l">Alertes</div><div class="n">${total}</div></div>
      <div class="carte"><div class="l">Secteurs touchés</div><div class="n">${secteurs.length}</div></div>
      <div class="carte"><div class="l">Pire taux</div><div class="n" style="color:${couleur(pire.taux_charge||0)}">${(pire.taux_charge||0).toFixed(0)} %</div></div>
      <div class="carte"><div class="l">Cellule critique</div><div class="n" style="font-size:17px">${esc(pire.cell_id||'—')}</div></div>
    </div>

    <section>
      <h2>Par secteur</h2>
      <table><thead><tr><th>Secteur</th><th>Alertes</th><th>Cellules</th><th>Taux max</th></tr></thead><tbody>
      ${secteurs.map(s => `<tr>
        <td>${esc(s.secteur)}</td><td>${s.alertes}</td><td>${s.cellules}</td>
        <td style="color:${couleur(s.taux_max)}">${s.taux_max.toFixed(1)} %</td></tr>`).join('')}
      </tbody></table>
    </section>

    <section>
      <h2>30 situations les plus critiques</h2>
      <table><thead><tr><th>Cellule</th><th>Secteur</th><th></th><th>Heure</th><th>Charge</th><th>Taux</th></tr></thead><tbody>
      ${resultats.slice(0,30).map(l => `<tr>
        <td>${esc(l.cell_id)}</td>
        <td>${esc(l.secteur)}</td>
        <td><span class="tag">${esc(l.techno)}</span></td>
        <td>${String(l.heure).padStart(2,'0')} h</td>
        <td><div class="barre"><i style="width:${Math.min(100, l.taux_charge)}%;background:${couleur(l.taux_charge)}"></i></div></td>
        <td style="color:${couleur(l.taux_charge)}">${l.taux_charge.toFixed(1)} %</td></tr>`).join('')}
      </tbody></table>
    </section>`;
}
charger();
setInterval(charger, 10000);
</script>
</body>
</html>
